plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt' // ✅ Needed for Room

}

android {
    namespace 'com.example.smartmedicinereminder'
    compileSdk 36 // ✅ Use 34 (last stable) unless 36 is specifically required

    defaultConfig {
        applicationId "com.example.smartmedicinereminder"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.13'
    }
    buildToolsVersion '36.0.0'
}

dependencies {
    // Compose Core
    implementation "androidx.compose.ui:ui:1.6.7"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.7"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation("androidx.compose.material3:material3:1.2.1")

    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation 'com.google.android.material:material:1.12.0'


    // Coil for Image Loading
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Room Database
    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    kapt "androidx.room:room-compiler:2.7.2"

    // Core AndroidX
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"

    // Debug
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.7"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation libs.androidx.compose.ui.ui.test.junit4
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.compose.material:material-icons-extended:1.6.7"
    // Lifecycle Compose extensions (for collectAsStateWithLifecycle)
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.2"
    implementation "androidx.compose.runtime:runtime-livedata:1.6.0" // or the latest version
    implementation "androidx.navigation:navigation-compose:2.7.7"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"


}